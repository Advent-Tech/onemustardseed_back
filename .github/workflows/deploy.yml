name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Code & Rebuild Container via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/onemustardseed' }}
        run: |
          echo "=========================================="
          echo "🚀 Deploying One Mustard Seed Backend"
          echo "=========================================="

          # Setup SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Ensure target directory exists on VPS
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p $DEPLOY_PATH/onemustardseed_back"

          # Sync repository files to VPS (excluding .env, node_modules, uploads, .git)
          echo "📦 Syncing backend files to VPS..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'uploads' \
            ./ "$USER@$HOST:$DEPLOY_PATH/onemustardseed_back/"

          # Rebuild and restart backend container
          echo "🐳 Rebuilding backend container on VPS..."
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "
            cd $DEPLOY_PATH
            podman rm -f oms-backend 2>/dev/null || true
            docker compose up -d --no-deps --build backend
            podman image prune -a -f
            sleep 3
            podman ps --filter name=oms-backend
          "

          echo "=========================================="
          echo "✅ Backend deployment completed!"
          echo "=========================================="
